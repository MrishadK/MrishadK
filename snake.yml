name: Generate contribution snake

on:
  # refresh every 12 hours
  schedule:
    - cron: "0 */12 * * *"
  # lets you run it manually from the Actions tab (do this once after adding the file)
  workflow_dispatch:
  # regenerate when this workflow changes or the README is edited
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#7C4DFF&color_dots=#ebedf0,#bbdefb,#64b5f6,#2196F3,#1565c0
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#B388FF&color_dots=#161b22,#0d3a66,#1565c0,#2196F3,#00E5FF

      - name: Push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
